# Tmux configuration by Emil Teurnberg
#
# Lives at ~/.config/tmux/tmux.conf, symlinked from this repo by install.sh.
# Targets tmux 3.5 or newer -- several options below do not exist on older
# releases, and the prefix binding is actively wrong on them.

# General options ------

# Prefix. Must be lowercase.
unbind-key C-b
set -g prefix C-q
bind-key -N 'Send C-q through to the pane' C-q send-prefix

# Reload
bind-key -N 'Reload tmux config' r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

# Window and pane indices start at one, and closing a window leaves no gap
set -g base-index 1
set -wg pane-base-index 1
set -g renumber-windows on

# Vim keys in copy mode and at the command prompt. Already implied by
# EDITOR=nvim containing "vi", but set explicitly so it survives EDITOR changing.
set -wg mode-keys vi
set -g status-keys vi

set -g mouse on

# Scrollback and timing (these were previously coming from tmux-sensible)
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5

# Let Neovim see FocusGained/FocusLost, so :autoread and friends work
set -g focus-events on

# OSC 52 clipboard in both directions. "on" rather than the default "external"
# is what additionally lets Neovim *inside* tmux set the system clipboard,
# including over SSH.
set -g set-clipboard on

# CSI u key encoding, so Neovim receives C-S-… and similar instead of having
# them collapse into their unmodified form on the way through tmux.
set -g extended-keys on

# Let programs send escape sequences straight through to the outer terminal,
# which terminal graphics protocols need in order to work inside tmux.
set -g allow-passthrough on

# Stop tmux renaming windows after whatever command is running. Note this is
# automatic-rename, not allow-rename -- the latter governs renames initiated by
# the program in the pane and has defaulted to off since tmux 2.7.
set -wg automatic-rename off

# Activity monitoring
set -wg monitor-activity on
set -g visual-activity on

# Colours ------

set -g default-terminal "tmux-256color"
# Fallback for terminals that do not export COLORTERM. tmux has inferred RGB
# from COLORTERM since 3.6, so this is belt-and-braces rather than required.
set -as terminal-features ",xterm*:RGB,*ghostty*:RGB"

# Theme: Solarized Dark ------
# Ported by hand from the tmuxline.vim snapshot generated in 2016. Every
# *-fg/*-bg/*-attr option that file used was removed in tmux 2.9; these are the
# *-style equivalents. tmuxline.vim is gone, so this is now the source of truth.

set -g status on
set -g status-justify left
set -g status-style "bg=colour0,fg=colour10"
set -g status-left-length 100
set -g status-right-length 100

# fill= is required from tmux 3.7 on for the message to span the whole line
set -g message-style "fg=colour7,bg=colour11,fill=colour11"
set -g message-command-style "fg=colour7,bg=colour11"

set -g pane-border-style "fg=colour11"
# Keeps the structure of tmux's own default so copy mode and synchronize-panes
# still recolour the active border, just in Solarized instead of the stock hues.
set -g pane-active-border-style "#{?pane_in_mode,fg=colour3,#{?synchronize-panes,fg=colour1,fg=colour14}}"

set -wg window-status-style "fg=colour10,bg=colour0"
set -wg window-status-activity-style "fg=colour14,bg=colour0"
set -wg window-status-separator ""

# Format strings carried over verbatim from the 2016 snapshot; the separators
# are Powerline glyphs (U+E0B0-E0B3) and need a Nerd Font to render.
set -g status-left "#[fg=colour15,bg=colour14,bold] #S #[fg=colour14,bg=colour0,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=colour11,bg=colour0,nobold,nounderscore,noitalics]#[fg=colour7,bg=colour11] %Y-%m-%d  %H:%M #[fg=colour14,bg=colour11,nobold,nounderscore,noitalics]#[fg=colour15,bg=colour14] #h "
set -wg window-status-format "#[fg=colour10,bg=colour0] #I #[fg=colour10,bg=colour0] #W "
set -wg window-status-current-format "#[fg=colour0,bg=colour11,nobold,nounderscore,noitalics]#[fg=colour7,bg=colour11] #I #[fg=colour7,bg=colour11] #W #[fg=colour11,bg=colour0,nobold,nounderscore,noitalics]"

# Keybinds ------

# Copy mode, vim style
unbind-key [
bind-key -N 'Enter copy mode' Escape copy-mode
unbind-key p
bind-key -N 'Paste the most recent buffer' p paste-buffer -p

# copy-command (3.2+) is the single place every copy-pipe binding sends text.
# set-clipboard above already covers the remote case via OSC 52; this makes the
# local clipboard work even where the terminal refuses OSC 52 writes.
if-shell 'command -v pbcopy >/dev/null' \
    'set -g copy-command "pbcopy"' \
    'set -g copy-command "xclip -selection clipboard -in"'

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

# Splits and new windows inherit the current pane's directory
bind-key -N 'Split pane horizontally' | split-window -h -c "#{pane_current_path}"
bind-key -N 'Split pane vertically'   - split-window -v -c "#{pane_current_path}"
bind-key -N 'New window here'         c new-window     -c "#{pane_current_path}"

# Move between panes vim style
bind-key -N 'Select pane left'  h select-pane -L
bind-key -N 'Select pane down'  j select-pane -D
bind-key -N 'Select pane up'    k select-pane -U
bind-key -N 'Select pane right' l select-pane -R

# Move between windows vim style (repeatable)
bind-key -r -N 'Previous window' C-h previous-window
bind-key -r -N 'Next window'     C-l next-window

# Resize panes vim style (repeatable)
bind-key -r -N 'Resize pane left'  H resize-pane -L 5
bind-key -r -N 'Resize pane down'  J resize-pane -D 5
bind-key -r -N 'Resize pane up'    K resize-pane -U 5
bind-key -r -N 'Resize pane right' L resize-pane -R 5

# lazygit in a popup over the current pane's repo
bind-key -N 'Open lazygit' g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazygit

# TPM Config ------

# List of plugins - TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Options for plugins

set -g @continuum-restore 'on' # Restore the last session when tmux starts
set -g @continuum-boot 'on'    # Start tmux on boot

# Initialise TPM (keep this at the bottom of this file!)
run '~/.config/tmux/plugins/tpm/tpm'
